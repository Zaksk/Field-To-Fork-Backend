version: '3.9'
services:
  field-to-fork-mvc:
    image: marypetrichenko/tour-de-france-mvc:0.0.1.RELEASE
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - food-db
    networks:
      - food

  field-to-fork-db:
    image: marypetrichenko/tour-de-france-db:0.0.1.RELEASE
    ports:
      - "5432:5432"
    restart: always
    networks:
      - food
      
networks:
  food: