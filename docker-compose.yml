version: '3.9'
services:
  field-to-fork-mvc:
    image: marypetrichenko/field-to-fork-mvc:0.0.1
    ports:
      - '3000:3000'
    restart: always
    depends_on:
      - field-to-fork-db
    networks:
      - field

  field-to-fork-db:
    image: marypetrichenko/field-to-fork-db:0.0.1
    ports:
      - '5432:5432'
    restart: always
    networks:
      - field

  field-to-fork-visuals:
    image: marypetrichenko/field-to-fork-visuals:0.0.1
    ports:
      - '5000:5000'
    restart: always
    networks:
      - field

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "666:666" # Port for mvc
      - "667:667" # Port for visuals
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/letsencrypt  # Mount SSL certificates
    networks:
      - field

networks:
  field: